<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake and Ladder</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:Arial,sans-serif;color:#19233c;background:#f4f7fc}
.wrap{max-width:1000px;margin:auto}
header{text-align:center;padding:20px}
header h1{font-size:clamp(34px,7vw,58px);margin:10px}
.card{background:white;border-radius:20px;padding:24px;box-shadow:0 10px 35px #19233c18}
.players{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.player{border:1px solid #e1e6ef;border-radius:14px;padding:16px}
label{display:block;margin:12px 0 5px;font-weight:bold}
input{width:100%;padding:12px;border:1px solid #ccd3df;border-radius:10px;font-size:16px}
button{border:0;border-radius:10px;padding:13px 18px;background:#1d9b87;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.08)}
#startButton{width:100%;margin-top:18px}
.game{display:none;grid-template-columns:minmax(280px,1fr) 280px;gap:20px}
.board{aspect-ratio:1;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);border:3px solid #19233c;border-radius:10px;overflow:hidden}
.cell{position:relative;padding:3px;border:1px solid #e4e8ef;background:#fff;font-size:clamp(8px,1.4vw,13px);font-weight:bold}
.cell:nth-child(4n+2),.cell:nth-child(4n+3){background:#fff5dd}
.cell.ladder{background:#dff5e9}
.cell.snake{background:#ffe1dc}
.tokens{position:absolute;bottom:2px;left:0;right:0;text-align:center}
.token{font-size:clamp(12px,2vw,20px)}
.side h2{margin-top:0}
.turn,.status{text-align:center;padding:12px;margin:10px 0;border-radius:10px;background:#f2f5fa}
.turn.p1{background:#fff0e9}
.turn.p2{background:#f0ebff}
.dice{text-align:center;font-size:52px;margin:8px}
#rollButton{width:100%;background:#ff794f}
.scores{margin:16px 0}
.score,.final-row{display:flex;justify-content:space-between;padding:10px 3px;border-bottom:1px solid #e8ebf1}
.winner-page{display:none;max-width:600px;margin:20px auto;text-align:center}
.trophy{font-size:75px}
.winner-page h1{font-size:clamp(36px,8vw,60px)}
.final-scores{max-width:360px;margin:20px auto;background:#f5f7fb;padding:12px;border-radius:14px}
.winner-page button{width:100%;margin-top:10px}
#homeButton{background:#19233c}
@media(max-width:700px){
  .players{grid-template-columns:1fr}
  .game{grid-template-columns:1fr}
  .side{order:-1}
  .card{padding:16px}
}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>🎲 PLAY TOGETHER</div>
    <h1>🐍 Snake &amp; 🪜 Ladder</h1>
    <p>Roll the dice. Climb the ladders. Race to 100!</p>
  </header>

  <section class="card" id="setup">
    <h2>Enter Player Details</h2>
    <form id="playerForm">
      <div class="players">
        <div class="player">
          <h3>🟠 Player 1</h3>
          <label for="name1">Name</label>
          <input id="name1" required maxlength="24" placeholder="Player 1 name">
          <label for="phone1">Contact number</label>
          <input id="phone1" type="tel" required pattern="[0-9+() -]{7,18}" placeholder="Phone number">
        </div>
        <div class="player">
          <h3>🟣 Player 2</h3>
          <label for="name2">Name</label>
          <input id="name2" required maxlength="24" placeholder="Player 2 name">
          <label for="phone2">Contact number</label>
          <input id="phone2" type="tel" required pattern="[0-9+() -]{7,18}" placeholder="Phone number">
        </div>
      </div>
      <button id="startButton" type="submit">Start Game →</button>
    </form>
  </section>

  <section class="game" id="game">
    <div class="card"><div class="board" id="board"></div></div>
    <aside class="card side">
      <h2>Game on!</h2>
      <div class="turn" id="turn"></div>
      <div class="dice" id="dice">🎲</div>
      <button id="rollButton">Roll the Dice</button>
      <div class="status" id="status">Roll a 6 to start!</div>
      <div class="scores" id="scores"></div>
      <p>🪜 Ladder: climb up<br>🐍 Snake: slide down<br>Reach 100 exactly to win.</p>
    </aside>
  </section>

  <section class="card winner-page" id="winnerPage">
    <div class="trophy">🏆</div>
    <p>GAME COMPLETE</p>
    <h1 id="winnerTitle">Winner!</h1>
    <p>Congratulations! You reached 100 points.</p>
    <div class="final-scores" id="finalScores"></div>
    <button id="newGameButton">New Game</button>
    <button id="homeButton">Home</button>
  </section>
</main>

<script>
const ladders = {3:22, 8:30, 20:41, 28:55, 36:44, 51:67, 71:91, 80:100};
const snakes = {17:7, 27:5, 34:1, 40:18, 48:26, 62:19, 73:53, 84:60, 92:72, 99:78};
const diceFaces = ["🎲","⚀","⚁","⚂","⚃","⚄","⚅"];

let players = [];
let positions = [0,0];
let turn = 0;
let finished = false;

const board = document.getElementById("board");

// Create the board. The rows alternate direction.
for (let row = 9; row >= 0; row--) {
  for (let col = 0; col < 10; col++) {
    const number = row % 2 === 0
      ? row * 10 + col + 1
      : row * 10 + 10 - col;

    const cell = document.createElement("div");
    cell.className = "cell";
    cell.id = "cell" + number;

    if (ladders[number]) cell.classList.add("ladder");
    if (snakes[number]) cell.classList.add("snake");

    let marker = "";
    if (ladders[number]) marker = " 🪜";
    if (snakes[number]) marker = " 🐍";

    cell.innerHTML = number + marker + '<div class="tokens"></div>';
    board.appendChild(cell);
  }
}

function escapeHtml(text) {
  return text.replace(/[&<>"']/g, character => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[character]);
}

function updateBoard() {
  for (let number = 1; number <= 100; number++) {
    document.querySelector("#cell" + number + " .tokens").innerHTML = "";
  }

  positions.forEach((position, index) => {
    if (position > 0) {
      const token = index === 0 ? "🟠" : "🟣";
      document.querySelector("#cell" + position + " .tokens").innerHTML =
        '<span class="token">' + token + "</span>";
    }
  });

  document.getElementById("scores").innerHTML = players.map((player, index) =>
    '<div class="score"><span>' +
    (index === 0 ? "🟠 " : "🟣 ") + escapeHtml(player.name) +
    '</span><strong>' + positions[index] + " points</strong></div>"
  ).join("");

  const turnBox = document.getElementById("turn");
  turnBox.textContent = players[turn].name + "'s turn";
  turnBox.className = "turn p" + (turn + 1);
}

document.getElementById("playerForm").addEventListener("submit", event => {
  event.preventDefault();

  players = [
    {name: document.getElementById("name1").value.trim()},
    {name: document.getElementById("name2").value.trim()}
  ];
  positions = [0,0];
  turn = 0;
  finished = false;

  document.getElementById("setup").style.display = "none";
  document.getElementById("winnerPage").style.display = "none";
  document.getElementById("game").style.display = "grid";
  document.getElementById("status").textContent = "Roll a 6 to start!";
  document.getElementById("dice").textContent = "🎲";
  updateBoard();
});

document.getElementById("rollButton").addEventListener("click", () => {
  if (finished) return;

  const roll = Math.floor(Math.random() * 6) + 1;
  document.getElementById("dice").textContent = diceFaces[roll];

  let message = players[turn].name + " rolled " + roll + ". ";

  if (positions[turn] === 0 && roll !== 6) {
    document.getElementById("status").textContent = message + "Roll a 6 to start.";
    turn = 1 - turn;
    updateBoard();
    return;
  }

  let nextPosition = positions[turn] === 0 ? roll : positions[turn] + roll;

  if (nextPosition > 100) {
    document.getElementById("status").textContent =
      message + "You need an exact roll to reach 100.";
    turn = 1 - turn;
    updateBoard();
    return;
  }

  positions[turn] = nextPosition;

  if (ladders[nextPosition]) {
    message += "Great! Climb the ladder to " + ladders[nextPosition] + "!";
    positions[turn] = ladders[nextPosition];
  } else if (snakes[nextPosition]) {
    message += "Oops! Slide down to " + snakes[nextPosition] + ".";
    positions[turn] = snakes[nextPosition];
  } else {
    message += "Moved to square " + nextPosition + ".";
  }

  if (positions[turn] === 100) {
    finished = true;
    showWinnerPage();
    return;
  }

  document.getElementById("status").textContent = message;
  turn = 1 - turn;
  updateBoard();
});

function showWinnerPage() {
  document.getElementById("game").style.display = "none";
  document.getElementById("winnerPage").style.display = "block";
  document.getElementById("winnerTitle").textContent =
    players[turn].name + " wins!";

  document.getElementById("finalScores").innerHTML = players.map((player, index) =>
    '<div class="final-row"><span>' + escapeHtml(player.name) +
    "</span><strong>" + positions[index] + " points</strong></div>"
  ).join("");
}

function newGame() {
  positions = [0,0];
  turn = 0;
  finished = false;

  document.getElementById("winnerPage").style.display = "none";
  document.getElementById("game").style.display = "grid";
  document.getElementById("dice").textContent = "🎲";
  document.getElementById("status").textContent = "Roll a 6 to start!";
  updateBoard();
}

document.getElementById("newGameButton").addEventListener("click", newGame);

document.getElementById("homeButton").addEventListener("click", () => {
  document.getElementById("winnerPage").style.display = "none";
  document.getElementById("setup").style.display = "block";
});
</script>
</body>
</html>
